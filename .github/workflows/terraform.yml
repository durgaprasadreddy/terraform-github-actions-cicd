name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Select Terraform action'
        required: true
        type: choice
        options:
          - apply
          - destroy
  push:
    branches: [ "main" ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEVOPS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEVOPS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init (Manual Trigger)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: terraform init -input=false -var="instance_type=t2.medium"

      - name: Terraform Apply/Destroy (Manual Trigger)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: terraform ${{ github.event.inputs.terraform_action }} -auto-approve -var="instance_type=t2.medium"

      - name: Terraform Init & Plan (Push)
        if: ${{ github.event_name == 'push' }}
        run: |
          terraform init -input=false -var="instance_type=t2.medium"
          terraform plan -input=false -var="instance_type=t2.medium"

      - name: Terraform Apply (Push)
        if: ${{ github.event_name == 'push' }}
        run: terraform apply -auto-approve -var="instance_type=t2.medium"