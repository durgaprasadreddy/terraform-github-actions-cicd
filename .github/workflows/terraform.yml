name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        type: choice
        description: Select Terraform action
        options:
          - apply
          - destroy
        required: true
  push:
    branches: [ "main" ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEVOPS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEVOPS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      # For push to main → init, plan, apply
      - name: Terraform Init & Plan (on push)
        if: ${{ github.event_name == 'push' }}
        run: |
          terraform init -input=false -var="instance_type=t2.medium"
          terraform plan -input=false -var="instance_type=t2.medium"

      - name: Terraform Apply (on push)
        if: ${{ github.event_name == 'push' }}
        run: terraform apply -auto-approve -var="instance_type=t2.medium"

      # For manual trigger → init + chosen action (apply/destroy)
      - name: Terraform Init (on manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: terraform init -input=false -var="instance_type=t2.medium"

      - name: Terraform Apply/Destroy (on manual trigger)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: terraform ${{ github.event.inputs.terraform_action }} -auto-approve -var="instance_type=t2.medium"